
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 250px);
            gap: 10px;
            padding: 10px;
        }

        .box {
            overflow: hidden;
        }

        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .img1 {
            grid-column: 1;
            grid-row: 1;
        }

        .img2 {
            grid-column: 2 / 4;
            grid-row: 1;
        }

        .img3 {
            grid-column: 1 / 3;
            grid-row: 2;
        }

        .img4 {
            grid-column: 3;
            grid-row: 2;
        }

        .img5 {
            grid-column: 1;
            grid-row: 3;
        }

        .img6 {
            grid-column: 2;
            grid-row: 3;
        }

        .img7 {
            grid-column: 3;
            grid-row: 3;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="box img1">
            <img src="./Img/nat1.webp" alt="">
        </div>

        <div class="box img2">
            <img src="./Img/nat2.jpg" alt="">
        </div>

        <div class="box img3">
            <img src="./Img/nat3.jpg" alt="">
        </div>

        <div class="box img4">
            <img src="./Img/nat4.jpeg" alt="">
        </div>

        <div class="box img5">
            <img src="./Img/nat5.jpg" alt="">
        </div>

        <div class="box img6">
            <img src="./Img/nat6.jpg" alt="">
        </div>

        <div class="box img7">
            <img src="./Img/nat7.jpg" alt="">
        </div>

    </div>

</body>
</html>
