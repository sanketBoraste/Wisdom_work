
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 3fr 1fr;
            grid-template-rows: 100px 70px 300px 70px;
            gap: 10px;
            padding: 20px;
            border: 8px solid black;
            margin: 20px;
        }

        .box {
            border: 2px solid gray;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: green;
        }

        .header {
            grid-column: 1 / 4;
        }

        .nav {
            grid-column: 1 / 4;
        }

        .left {
            grid-column: 1;
        }

        .main {
            grid-column: 2;
        }

        .right {
            grid-column: 3;
        }

        .footer {
            grid-column: 1 / 4;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="box header">Header</div>

        <div class="box nav">Navigation Menu</div>

        <div class="box left">Content</div>

        <div class="box main">Main Content</div>

        <div class="box right">Content</div>

        <div class="box footer">Footer</div>

    </div>

</body>
</html>
