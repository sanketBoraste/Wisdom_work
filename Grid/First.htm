
<!DOCTYPE html>
<html lang="en">
<head>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
}

.container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 15px;
    width: 90%;
    height: 90vh;
    margin: 20px auto;
}

.box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}


.img1 {
    grid-column: 1;
    grid-row: 1;
}

.img2 {
    grid-column: 2;
    grid-row: 1;
}


.img3 {
    grid-column: 3 / 5;
    grid-row: 1 / 3;
}

.img4 {
    grid-column: 1 / 3;
    grid-row: 2;
}


.img5 {
    grid-column: 1 / 3;
    grid-row: 3;
}


.img6 {
    grid-column: 3 / 5;
    grid-row: 3;
}

</style>
</head>

<body>

<div class="container">

    <div class="box img1">
        <img src="./Img/image.png" alt="">
    </div>

    <div class="box img2">
        <img src="./Img/img2.webp" alt="">
    </div>

    <div class="box img3">
        <img src="./Img/img3.jpg" alt="">
    </div>

    <div class="box img4">
        <img src="./Img/img4.jpg" alt="">
    </div>

    <div class="box img5">
        <img src="./Img/img5.jpg" alt="">
    </div>

    <div class="box img6">
        <img src="./Img/img6.jpg" alt="">
    </div>

</div>

</body>
</html>
