<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration</title>
  <style>
    * { 
        margin: 0; 
        padding: 0; 
        box-sizing: border-box; 
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: #fff;
      width: 400px;
      padding: 40px 35px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 1.5rem;
      color: #333;
      text-align: center;
      margin-bottom: 25px;
    }

    .toggle {
      display: flex;
      justify-content: center;
      margin-bottom: 25px;
      gap: 0;
    }

    .toggle button {
      padding: 10px 28px;
      border: 2px solid #4a90d9;
      background: #fff;
      color: #4a90d9;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle button:first-child {
      border-radius: 8px 0 0 8px;
    }

    .toggle button:last-child {
      border-radius: 0 8px 8px 0;
    }

    .toggle button.active {
      background: #4a90d9;
      color: #fff;
    }

    /* Form fields */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 6px;
    }

    .form-group input[type="text"],
    .form-group input[type="email"],
    .form-group input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #4a90d9;
    }

    /* Gender */
    .gender {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .gender label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      color: #444;
      cursor: pointer;
    }

    .gender input[type="radio"] {
      accent-color: #4a90d9;
      width: 18px;
      height: 18px;
    }

    /* Disclaimer */
    .disclaimer {
      font-size: 0.78rem;
      color: #888;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    /* Submit */
    .btn-register {
      width: 100%;
      padding: 13px;
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-register:hover {
      background: #3579c0;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Registration</h1>

    <div class="toggle">
      <button class="active" onclick="setToggle(this)">Personal</button>
      <button onclick="setToggle(this)">Company</button>
    </div>

    <form>
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label>Name</label>
        <input type="text" placeholder="Your name">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="••••••••">
      </div>

      <div class="gender">
        <label><input type="radio" name="gender" value="male" checked> Male</label>
        <label><input type="radio" name="gender" value="female"> Female</label>
      </div>

      <p class="disclaimer">By clicking Register, you agree on our terms and condition.</p>

      <button type="submit" class="btn-register">Register</button>
    </form>
  </div>
</body>
</html>
