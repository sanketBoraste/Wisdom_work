<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: sans-serif;
    }
    .Register {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f5f5f5;
    }
    .container {
      border: 1px solid black;
      border-radius: 20px;
      padding: 30px;
      background-color: white;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    input {
      margin-bottom: 15px;
      padding: 8px;
      width: 100%;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <section class="Register">
    <div class="container">
      <form action="">
        <h1>Register</h1>
        <h3>Kindly Fill this form to register</h3>
        
        <label for="Username">Username:</label><br />
        <input type="text" id="Username" placeholder="Enter Username" required /><br />
        
        <label for="Email">Email:</label><br />
        <input type="email" id="Email" placeholder="Enter Email" required /><br />
        
        <label for="password">Password:</label><br />
        <input type="password" id="password" placeholder="Enter Password" required /><br />
        
        <label for="Confirm_pass">Confirm Password:</label><br />
        <input type="password" id="Confirm_pass" placeholder="Confirm Password" required /><br />
        
        <button type="submit">Register</button><br /><br />
        <h3>Already Have Account? <a href="#">Login</a></h3>
      </form>
    </div>
  </section>
</body>
</html>
